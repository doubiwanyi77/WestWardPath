services:
  mysql:
    image: mysql:8.0
    container_name: westwardpath2-mysql
    environment:
      MYSQL_ROOT_PASSWORD: westwardpath2_root
      MYSQL_DATABASE: westwardpath2
      MYSQL_USER: westwardpath2
      MYSQL_PASSWORD: westwardpath2
    ports:
      - "3306:3306"
    volumes:
      - westwardpath2-mysql:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwestwardpath2", "-pwestwardpath2"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: westwardpath2-redis
    ports:
      - "6379:6379"
    volumes:
      - westwardpath2-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  westwardpath2-mysql:
  westwardpath2-redis:
